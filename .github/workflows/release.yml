name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify semantic version and changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(printf '%s' "$TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$/\1/p')" != ""
          grep -F "## [${TAG#v}]" CHANGELOG.md
      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sed -n "/^## [${TAG#v}]/,/^## /p" CHANGELOG.md | sed '$d' > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
