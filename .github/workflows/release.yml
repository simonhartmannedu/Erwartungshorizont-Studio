name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Verify semantic version and changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(printf '%s' "$TAG" | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$/\1/p')" != ""
          grep -E "^## (\\[)?${TAG#v}(\\])?([[:space:]]|$)" CHANGELOG.md
      - name: Lint, type check and unit tests
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run test:regression
      - name: Build demo bundle
        run: npm run build:demo -- --outDir .demo-dist
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run end-to-end tests against the production build
        run: npm run test:e2e:preview
      - name: Security audit (high threshold)
        run: npm audit --omit=dev --audit-level=high
      - name: Build downloadable app bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run build
          cd dist
          zip -r "../EWH-Studio-${TAG}.zip" .
      - name: Create GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v version="${TAG#v}" '
            $0 ~ "^## (\\[)?" version "(\\])?([[:space:]]|$)" { found = 1 }
            found && /^## / && $0 !~ "^## (\\[)?" version "(\\])?([[:space:]]|$)" { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "EWH-Studio-${TAG}.zip"
